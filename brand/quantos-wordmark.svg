<svg xmlns="http://www.w3.org/2000/svg" viewBox="-19.98 89.79 619.65 153.28" width="619.65" height="153.28" role="img" aria-label="Quantos">
  <title>Quantos</title>
  <g fill="currentColor">
    <g transform="translate(-15.984907232722602 93.79) scale(0.13889049641778262) translate(-104 -103)">
      
        <defs>
          <!-- Background Squircle Gradient -->
          <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#282930" />
            <stop offset="25%" stop-color="#202127" />
            <stop offset="65%" stop-color="#121317" />
            <stop offset="100%" stop-color="#090a0d" />
          </linearGradient>
      
          <!-- Squircle Border Highlight -->
          <linearGradient id="squircleRim" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
            <stop offset="35%" stop-color="#ffffff" stop-opacity="0.03" />
            <stop offset="75%" stop-color="#000000" stop-opacity="0.35" />
            <stop offset="100%" stop-color="#000000" stop-opacity="0.75" />
          </linearGradient>
      
          <!-- Ambient Blue Glow Filters -->
          <filter id="ambientArcGlow" x="-70%" y="-70%" width="240%" height="240%">
            <feGaussianBlur stdDeviation="28" result="blur1" />
            <feGaussianBlur stdDeviation="12" result="blur2" />
            <feMerge>
              <feMergeNode in="blur1" />
              <feMergeNode in="blur2" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
      
          <filter id="softOrbGlow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="22" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
      
          <!-- Drop Shadows for Cards -->
          <filter id="cardShadow" x="-70%" y="-70%" width="240%" height="240%">
            <feDropShadow dx="-6" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.55" />
          </filter>
      
          <filter id="frontCardShadow" x="-90%" y="-90%" width="280%" height="280%">
            <feDropShadow dx="-6" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.65" />
            <feDropShadow dx="8" dy="20" stdDeviation="26" flood-color="#000000" flood-opacity="0.5" />
          </filter>
      
          <filter id="pillShadow" x="-70%" y="-70%" width="240%" height="240%">
            <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.35" />
          </filter>
      
          <!-- Ambient glow behind dot -->
          <radialGradient id="dotAmbient" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#0094ff" stop-opacity="0.75" />
            <stop offset="35%" stop-color="#0077ff" stop-opacity="0.4" />
            <stop offset="70%" stop-color="#0055ff" stop-opacity="0.12" />
            <stop offset="100%" stop-color="#0033ff" stop-opacity="0" />
          </radialGradient>
      
          <!-- Outer Large Arc Gradient -->
          <linearGradient id="outerArcGrad" x1="80%" y1="5%" x2="20%" y2="95%">
            <stop offset="0%" stop-color="#00e5ff" />
            <stop offset="15%" stop-color="#00c0ff" />
            <stop offset="45%" stop-color="#0088ff" />
            <stop offset="80%" stop-color="#0072ff" />
            <stop offset="100%" stop-color="#00a2ff" />
          </linearGradient>
      
          <!-- Outer Arc 3D Tubular Highlight -->
          <linearGradient id="outerArcTube" x1="75%" y1="10%" x2="25%" y2="90%">
            <stop offset="0%" stop-color="#8ceeff" stop-opacity="0.85" />
            <stop offset="25%" stop-color="#38c8ff" stop-opacity="0.6" />
            <stop offset="60%" stop-color="#0099ff" stop-opacity="0.2" />
            <stop offset="100%" stop-color="#60d0ff" stop-opacity="0.75" />
          </linearGradient>
      
          <!-- Right Arc Gradient -->
          <linearGradient id="rightArcGrad" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#00e5ff" />
            <stop offset="35%" stop-color="#00aeff" />
            <stop offset="70%" stop-color="#007eff" />
            <stop offset="100%" stop-color="#0066ee" />
          </linearGradient>
      
          <linearGradient id="rightArcTube" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#99f0ff" stop-opacity="0.9" />
            <stop offset="40%" stop-color="#38c8ff" stop-opacity="0.6" />
            <stop offset="100%" stop-color="#0077ff" stop-opacity="0.2" />
          </linearGradient>
      
          <!-- Inner Arc Gradient -->
          <linearGradient id="innerArcGrad" x1="80%" y1="0%" x2="20%" y2="100%">
            <stop offset="0%" stop-color="#00e0ff" />
            <stop offset="45%" stop-color="#0090ff" />
            <stop offset="100%" stop-color="#0066ee" />
          </linearGradient>
      
          <linearGradient id="innerArcTube" x1="80%" y1="0%" x2="20%" y2="100%">
            <stop offset="0%" stop-color="#a0f2ff" stop-opacity="0.85" />
            <stop offset="40%" stop-color="#40c8ff" stop-opacity="0.5" />
            <stop offset="100%" stop-color="#0077ee" stop-opacity="0.1" />
          </linearGradient>
      
          <!-- 3D Glowing Sphere/Orb Gradient -->
          <radialGradient id="sphereGrad" cx="33%" cy="28%" r="68%">
            <stop offset="0%" stop-color="#e6faff" />
            <stop offset="18%" stop-color="#6be0ff" />
            <stop offset="48%" stop-color="#0099ff" />
            <stop offset="78%" stop-color="#005ad4" />
            <stop offset="92%" stop-color="#003ca0" />
            <stop offset="100%" stop-color="#002470" />
          </radialGradient>
      
          <!-- Card 3 (Back Card) Gradient -->
          <linearGradient id="backCardGrad" x1="10%" y1="0%" x2="90%" y2="100%">
            <stop offset="0%" stop-color="#0066ee" />
            <stop offset="40%" stop-color="#0050d4" />
            <stop offset="100%" stop-color="#00359e" />
          </linearGradient>
      
          <!-- Card 2 (Middle Card) Gradient -->
          <linearGradient id="midCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0099ff" />
            <stop offset="40%" stop-color="#0080f0" />
            <stop offset="100%" stop-color="#005ada" />
          </linearGradient>
      
          <!-- Card 1 (Front Dark Card) Face Gradient -->
          <linearGradient id="frontCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#30323a" />
            <stop offset="30%" stop-color="#282a31" />
            <stop offset="70%" stop-color="#202227" />
            <stop offset="100%" stop-color="#16171b" />
          </linearGradient>
      
          <!-- Front Card Bevel / Top Rim Highlight -->
          <linearGradient id="cardBevelGrad" x1="0%" y1="0%" x2="100%" y2="25%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
            <stop offset="45%" stop-color="#ffffff" stop-opacity="0.12" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
          </linearGradient>
      
          <!-- Checkbox Blue Gradient -->
          <linearGradient id="checkboxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00d2ff" />
            <stop offset="100%" stop-color="#0077ff" />
          </linearGradient>
      
          <!-- White Pill Gradient -->
          <linearGradient id="pillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="60%" stop-color="#f2f4f7" />
            <stop offset="100%" stop-color="#dde1e8" />
          </linearGradient>
        </defs>
      
        <!-- 2. CONCENTRIC CIRCULAR ARCS -->
        <g id="Arcs">
          <!-- OUTER LARGE ARC (C-shape from top counter-clockwise to bottom-right) -->
          <!-- Center (626, 626), R=407, width=108 -->
          <!-- Ambient glow under arc -->
          <path d="M 654.4 220 A 407 407 0 1 0 778.5 1003.4" 
                fill="none" stroke="#0077ff" stroke-width="128" stroke-linecap="round" opacity="0.45" filter="url(#ambientArcGlow)" />
          <!-- Base solid gradient stroke -->
          <path d="M 654.4 220 A 407 407 0 1 0 778.5 1003.4" 
                fill="none" stroke="url(#outerArcGrad)" stroke-width="108" stroke-linecap="round" />
          <!-- 3D Tubular highlight -->
          <path d="M 654.4 220 A 407 407 0 1 0 778.5 1003.4" 
                fill="none" stroke="url(#outerArcTube)" stroke-width="40" stroke-linecap="round" opacity="0.85" />
      
          <!-- OUTER RIGHT ARC (Top-right segment) -->
          <!-- From angle -64 deg (805, 260) to angle +18 deg (1013, 752) -->
          <!-- Ambient glow -->
          <path d="M 804.6 260.1 A 407 407 0 0 1 1013.1 751.8" 
                fill="none" stroke="#0088ff" stroke-width="128" stroke-linecap="round" opacity="0.45" filter="url(#ambientArcGlow)" />
          <!-- Base stroke -->
          <path d="M 804.6 260.1 A 407 407 0 0 1 1013.1 751.8" 
                fill="none" stroke="url(#rightArcGrad)" stroke-width="108" stroke-linecap="round" />
          <!-- 3D Tubular highlight -->
          <path d="M 804.6 260.1 A 407 407 0 0 1 1013.1 751.8" 
                fill="none" stroke="url(#rightArcTube)" stroke-width="40" stroke-linecap="round" opacity="0.85" />
      
          <!-- INNER ARC (Left side, R=320, width=58) -->
          <!-- Ambient glow -->
          <path d="M 641.0 268.0 A 320 320 0 0 0 380.9 831.7" 
                fill="none" stroke="#0077ff" stroke-width="74" stroke-linecap="round" opacity="0.4" filter="url(#ambientArcGlow)" />
          <!-- Base stroke -->
          <path d="M 641.0 268.0 A 320 320 0 0 0 380.9 831.7" 
                fill="none" stroke="url(#innerArcGrad)" stroke-width="58" stroke-linecap="round" />
          <!-- Inner Ridge highlight -->
          <path d="M 641.0 268.0 A 320 320 0 0 0 380.9 831.7" 
                fill="none" stroke="url(#innerArcTube)" stroke-width="22" stroke-linecap="round" opacity="0.85" />
        </g>
      
        <!-- 3. DECK OF CARDS (Center) -->
        <g id="DeckCards">
          <!-- CARD 3 (Back Card, Royal Blue, tilted ~12.5 deg counter-clockwise) -->
          <g transform="translate(685, 605) rotate(-12.5) translate(-685, -605)" filter="url(#cardShadow)">
            <rect x="490" y="355" width="385" height="490" rx="44" ry="44" fill="url(#backCardGrad)" />
            <!-- Top and edge rim light -->
            <rect x="490" y="355" width="385" height="490" rx="44" ry="44" fill="none" stroke="#389eff" stroke-width="2.5" opacity="0.5" />
          </g>
      
          <!-- CARD 2 (Middle Card, Cyan-Blue, tilted ~4.5 deg counter-clockwise) -->
          <g transform="translate(645, 615) rotate(-4.5) translate(-645, -615)" filter="url(#cardShadow)">
            <rect x="445" y="372" width="395" height="498" rx="46" ry="46" fill="url(#midCardGrad)" />
            <!-- Top and edge rim light -->
            <rect x="445" y="372" width="395" height="498" rx="46" ry="46" fill="none" stroke="#80d0ff" stroke-width="2.5" opacity="0.65" />
          </g>
      
          <!-- CARD 1 (Front Dark Card, Charcoal Checklist, tilted ~8.4 deg clockwise) -->
          <g transform="translate(586, 650) rotate(8.4) translate(-586, -650)" filter="url(#frontCardShadow)">
            <!-- Main dark face -->
            <rect x="388" y="418" width="396" height="464" rx="52" ry="52" fill="url(#frontCardGrad)" />
            
            <!-- Top / Left Specular Bevel Line -->
            <rect x="388" y="418" width="396" height="464" rx="52" ry="52" fill="none" stroke="url(#cardBevelGrad)" stroke-width="3" />
      
            <!-- CHECKLIST ITEMS (Inside the front card) -->
            <!-- Row 1: Checkbox + Text Bar -->
            <g id="Row1">
              <!-- Checkbox 1 -->
              <rect x="434" y="498" width="77" height="82" rx="20" ry="20" fill="url(#checkboxGrad)" filter="url(#pillShadow)" />
              <!-- White Checkmark 1 -->
              <polyline points="449,539 465,562 496,527" 
                        fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
              <!-- White Bar 1: pill shape -->
              <rect x="538" y="534" width="186" height="61" rx="30.5" ry="30.5" fill="url(#pillGrad)" filter="url(#pillShadow)" />
            </g>
      
            <!-- Row 2: Checkbox + Text Bar -->
            <g id="Row2">
              <!-- Checkbox 2 -->
              <rect x="434" y="599" width="77" height="82" rx="20" ry="20" fill="url(#checkboxGrad)" filter="url(#pillShadow)" />
              <!-- White Checkmark 2 -->
              <polyline points="448,640 464,663 495,628" 
                        fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
              <!-- White Bar 2: pill shape -->
              <rect x="538" y="635" width="187" height="61" rx="30.5" ry="30.5" fill="url(#pillGrad)" filter="url(#pillShadow)" />
            </g>
      
            <!-- Row 3: Bullet Dot + Text Bar -->
            <g id="Row3">
              <!-- Bullet Circle: center at (472.5, 742), r=36 -->
              <circle cx="472.5" cy="742" r="36" fill="url(#checkboxGrad)" filter="url(#pillShadow)" />
              <!-- White Bar 3: pill shape -->
              <rect x="537" y="736" width="187" height="62" rx="31" ry="31" fill="url(#pillGrad)" filter="url(#pillShadow)" />
            </g>
          </g>
        </g>
      
        <!-- 4. GLOWING BLUE ORB / DOT (Bottom-Right) -->
        <g id="GlowingOrb">
          <!-- Ambient outer halo -->
          <circle cx="897" cy="938" r="145" fill="#0088ff" opacity="0.5" filter="url(#softOrbGlow)" />
          <!-- Drop shadow onto background -->
          <circle cx="897" cy="948" r="115" fill="#000000" opacity="0.45" filter="url(#softOrbGlow)" />
          <!-- 3D Shaded Sphere -->
          <circle cx="897" cy="938" r="108.5" fill="url(#sphereGrad)" />
          <!-- Soft secondary rim glow -->
          <circle cx="897" cy="938" r="108.5" fill="none" stroke="#a0f0ff" stroke-width="2" opacity="0.4" />
        </g>
      
    </g>
    <path d="M198.77 139.8L198.69 169.9Q198.69 176.18 196.37 181.64Q194.04 187.1 189.92 191.23Q185.79 195.36 180.33 197.68Q174.87 200 168.67 200L162.31 200Q156.12 200 150.66 197.68Q145.2 195.36 141.07 191.19Q136.94 187.01 134.62 181.55Q132.3 176.09 132.3 169.9L132.3 139.8L140.9 139.8L140.9 169.9Q140.9 175.83 143.78 180.69Q146.66 185.55 151.56 188.48Q156.46 191.4 162.31 191.4L168.67 191.4Q174.61 191.4 179.47 188.48Q184.33 185.55 187.21 180.69Q190.09 175.83 190.09 169.9L190.09 139.8ZM279.61 200L271.01 200L271.01 182.8L222.94 182.8L222.94 174.2L271.01 174.2L271.01 148.4L240.14 148.4Q234.29 148.4 229.39 151.28Q224.49 154.16 221.61 159.06Q218.73 163.97 218.73 169.9L218.73 200L210.13 200L210.13 169.9Q210.13 163.71 212.45 158.25Q214.77 152.79 218.9 148.62Q223.03 144.44 228.49 142.12Q233.95 139.8 240.14 139.8L279.61 139.8ZM302.66 200L294.06 200L294.06 139.8L298.36 139.8Q304.64 139.8 311.99 142.21Q319.35 144.62 326.74 149Q334.14 153.39 340.72 159.45Q347.3 165.51 352.03 172.91L352.03 139.8L360.63 139.8L360.63 200L352.03 200Q352.03 192.09 348.8 184.82Q345.58 177.55 340.24 171.41Q334.91 165.26 328.42 160.48Q321.93 155.71 315.22 152.66Q308.51 149.6 302.66 148.74ZM407.75 200L399.15 200L399.15 148.4L368.71 148.4L368.71 139.8L438.2 139.8L438.2 148.4L407.75 148.4ZM518.18 169.9Q518.18 176.18 516.2 181.64Q514.22 187.1 510.57 191.23Q506.91 195.36 501.84 197.68Q496.76 200 490.57 200L470.53 200Q464.26 200 459.18 197.68Q454.11 195.36 450.45 191.23Q446.8 187.1 444.82 181.64Q442.84 176.18 442.84 169.9Q442.84 163.71 444.82 158.25Q446.8 152.79 450.45 148.62Q454.11 144.44 459.18 142.12Q464.26 139.8 470.53 139.8L490.57 139.8Q496.76 139.8 501.84 142.12Q506.91 144.44 510.57 148.62Q514.22 152.79 516.2 158.25Q518.18 163.71 518.18 169.9ZM509.58 169.9Q509.58 163.97 507.3 159.06Q505.02 154.16 500.76 151.28Q496.51 148.4 490.57 148.4L470.53 148.4Q464.6 148.4 460.34 151.28Q456.09 154.16 453.76 159.06Q451.44 163.97 451.44 169.9Q451.44 175.83 453.76 180.69Q456.09 185.55 460.34 188.48Q464.6 191.4 470.53 191.4L490.57 191.4Q496.51 191.4 500.76 188.48Q505.02 185.55 507.3 180.69Q509.58 175.83 509.58 169.9ZM595.66 182.8Q595.66 187.53 593.34 191.44Q591.02 195.36 587.15 197.68Q583.28 200 578.46 200L526.18 200L526.18 191.4L578.46 191.4Q582.08 191.4 584.57 188.86Q587.06 186.33 587.06 182.8Q587.06 179.27 584.57 176.74Q582.08 174.2 578.46 174.2L543.38 174.2Q538.65 174.2 534.73 171.88Q530.82 169.56 528.5 165.64Q526.18 161.73 526.18 157Q526.18 152.27 528.5 148.36Q530.82 144.44 534.73 142.12Q538.65 139.8 543.38 139.8L591.36 139.8L591.36 148.4L543.38 148.4Q539.85 148.4 537.31 150.94Q534.78 153.47 534.78 157Q534.78 160.53 537.31 163.06Q539.85 165.6 543.38 165.6L578.46 165.6Q583.28 165.6 587.15 167.92Q591.02 170.24 593.34 174.16Q595.66 178.07 595.66 182.8Z"/>
  </g>
</svg>

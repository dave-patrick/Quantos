services:
  quantos:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: quantos-server:local
    container_name: quantos-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:47830:8080"
      # To also listen on the local network, add a line such as:  - "192.168.1.20:47831:8080"
      # (plain HTTP; allow the port through the firewall for your local subnet only).
    volumes:
      - quantos-data:/data
    environment:
      QUANTOS_SERVER_TOKEN_FILE: /run/secrets/quantos-token
      QUANTOS_MCP_TOKEN_FILE: /run/secrets/quantos-mcp-token
      TZ: "${TZ:-Etc/UTC}"
    secrets:
      - quantos-token
      - quantos-mcp-token
secrets:
  quantos-token:
    file: ./server-token
  quantos-mcp-token:
    file: ./mcp-token
volumes:
  quantos-data:
